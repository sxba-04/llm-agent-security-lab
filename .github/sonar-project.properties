# Kept outside the repository root until CI analysis is activated in Sonar.
# The scanner receives this file through -Dproject.settings.
sonar.projectKey=sxba-04_llm-agent-security-lab
sonar.projectName=llm-agent-security-lab
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Test classification changes measurement scope, not the experimental controls.
sonar.sources=src/security_lab,frontend/src,scripts,.github
sonar.tests=tests,frontend/src,frontend/e2e,frontend/e2e-hosted
sonar.test.inclusions=tests/**,frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test-setup.ts,frontend/e2e/**,frontend/e2e-hosted/**
sonar.exclusions=frontend/src/**/*.test.ts,frontend/src/**/*.test.tsx,frontend/src/test-setup.ts
sonar.python.coverage.reportPaths=coverage/python/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
