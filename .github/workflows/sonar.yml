name: SonarQube Cloud with coverage

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  availability:
    name: Sonar integration status
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      enabled: ${{ steps.status.outputs.enabled }}
    steps:
      - name: Explain whether CI analysis is available
        id: status
        env:
          SONAR_CI_ENABLED: ${{ vars.SONAR_CI_ENABLED }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          UNTRUSTED_PR: ${{ github.event_name == 'pull_request' && (github.event.pull_request.head.repo.full_name != github.repository || github.event.pull_request.user.login == 'dependabot[bot]') }}
        run: |
          echo '## SonarQube Cloud integration' >> "$GITHUB_STEP_SUMMARY"
          if [ "$UNTRUSTED_PR" = 'true' ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'CI analysis skipped for a fork or Dependabot PR: no Sonar secret is exposed. Tests and coverage artifacts remain available; main is analyzed after merge when configured. This is not a passed quality gate.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$SONAR_CI_ENABLED" != 'true' ]; then
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo 'CI analysis is not activated. Keep the existing automatic Sonar analysis until SONAR_TOKEN and SONAR_ORGANIZATION are configured, then disable Automatic Analysis in Sonar and set SONAR_CI_ENABLED=true. See docs/quality-tooling.md. This job does not assert a passed quality gate or uploaded coverage.' >> "$GITHUB_STEP_SUMMARY"
          elif [ -z "$SONAR_ORGANIZATION" ]; then
            echo '::error::SONAR_ORGANIZATION is required when SONAR_CI_ENABLED=true.'
            exit 1
          else
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
            echo 'CI analysis is activated. The separate Sonar analysis job determines the quality gate result.' >> "$GITHUB_STEP_SUMMARY"
          fi

  analyze:
    name: Sonar analysis and quality gate
    needs: availability
    if: needs.availability.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require the analysis credential
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo '::error::SONAR_TOKEN is missing. Store it as a repository Actions secret; never put it in a variable or source file.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Retrieve Python coverage from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-coverage
          path: coverage/python
      - name: Retrieve frontend coverage from this workflow run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-coverage
          path: frontend/coverage
      - name: Require both coverage reports
        run: |
          test -s coverage/python/coverage.xml
          test -s frontend/coverage/lcov.info
      - name: Scan the tested revision and wait for its quality gate
        id: sonar_scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >-
            -Dsonar.scanner.autoconfig.enabled=false
            -Dproject.settings=.github/sonar-project.properties
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.scm.revision=${{ github.event.pull_request.head.sha || github.sha }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
      - name: Collect sanitized PR diagnostics after scanner submission
        id: pr_inventory
        if: ${{ always() && !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && (steps.sonar_scan.outcome == 'success' || steps.sonar_scan.outcome == 'failure') && hashFiles('.scannerwork/report-task.txt') != '' }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          LAB_SONAR_PR: ${{ github.event.pull_request.number }}
          LAB_EXPECTED_REVISION: ${{ github.event.pull_request.head.sha }}
        run: >-
          python3 scripts/sonar_inventory.py
          --pull-request "$LAB_SONAR_PR"
          --expected-revision "$LAB_EXPECTED_REVISION"
          --scanner-report .scannerwork/report-task.txt
      - name: Preserve sanitized PR inventory even when the quality gate failed
        if: ${{ always() && !cancelled() && steps.pr_inventory.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-pr-inventory
          path: quality-inventory/sonar-pr.json
          if-no-files-found: error
          retention-days: 14
      - name: Collect the analyzed main-branch issue inventory
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: python3 scripts/sonar_inventory.py
      - name: Preserve the current main-branch inventory
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sonar-main-inventory
          path: quality-inventory/sonar-main.json
          if-no-files-found: error
          retention-days: 14
