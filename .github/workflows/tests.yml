name: Offline tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Behavioral tests without API keys
        run: python -m unittest discover -s tests -v
      - name: Complete development catalog with mock only
        run: python -m security_lab run --output runs/ci --repeats 1
      - name: Recompute summary from verified originals
        run: python -m security_lab summarize runs/ci --output runs/ci/recomputed.json
      - name: Export blinded review material
        run: python -m security_lab review-export runs/ci --output runs/review
