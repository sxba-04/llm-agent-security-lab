name: Offline tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: offline-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sonar:
    name: SonarQube Cloud
    needs: [test, frontend]
    uses: ./.github/workflows/sonar.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install locked Python environment including local web tools
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked --extra web --group dev
      - name: Install and require independent PDF renderer on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils
          command -v pdftoppm
      - name: Behavioral tests without API keys
        id: python_tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            uv run --locked --extra web coverage run -m unittest discover -s tests -v
          else
            uv run --locked --extra web python -m unittest discover -s tests -v
          fi
      - name: Report Python line and branch coverage
        id: python_coverage
        if: runner.os == 'Linux'
        run: |
          uv run --locked --extra web coverage xml
          uv run --locked --extra web coverage json
          uv run --locked --extra web coverage html
          uv run --locked --extra web coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve Python coverage for Sonar and review
        if: ${{ always() && runner.os == 'Linux' && steps.python_coverage.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-coverage
          path: coverage/python/
          if-no-files-found: error
          retention-days: 14
      - name: Run and verify the complete synthetic development catalog
        id: mock_campaign
        run: uv run --locked --extra web python scripts/ci_mock_campaign.py --preset catalog96 --repeats 1 --output runs/ci
      - name: Preserve synthetic campaign evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: mock-evidence-${{ runner.os }}
          path: |
            runs/ci/campaign.zip
            runs/ci/summary.json
            runs/ci/restored-summary.json
            runs/ci/metrics.csv
            runs/ci/verification.json
            runs/ci/result.json
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve incomplete mock evidence for diagnosis
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ always() && (steps.mock_campaign.outcome == 'failure' || steps.mock_campaign.outcome == 'cancelled') }}
        with:
          name: unverified-mock-diagnostics-${{ runner.os }}
          path: |
            runs/ci/campaign/manifest.json
            runs/ci/campaign/cases.snapshot.json
            runs/ci/campaign/records/
            runs/ci/campaign/events/
            runs/ci/campaign/reviews/
          if-no-files-found: warn
          retention-days: 14
      - name: Summarize Python checks
        if: always()
        shell: python {0}
        env:
          LAB_TEST_OUTCOME: ${{ steps.python_tests.outcome }}
          LAB_CAMPAIGN_OUTCOME: ${{ steps.mock_campaign.outcome }}
        run: |
          import os
          from pathlib import Path
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
              stream.write("## Python checks on " + os.environ["RUNNER_OS"] + "\n\n")
              stream.write("- Behavioral tests: **" + os.environ["LAB_TEST_OUTCOME"] + "**.\n")
              stream.write("- Synthetic campaign and archive roundtrip: **" + os.environ["LAB_CAMPAIGN_OUTCOME"] + "**.\n")
              stream.write("- Checked-out commit: `" + os.environ["GITHUB_SHA"] + "`.\n")
              stream.write("- Artifacts expire after 14 days; download evidence you want to keep.\n")
  frontend:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: React tests with coverage on Linux
        id: react_tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            npm run test:coverage
          else
            npm test
          fi
      - name: Preserve frontend coverage for Sonar and review
        if: ${{ always() && runner.os == 'Linux' && steps.react_tests.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: error
          retention-days: 14
      - run: npm run build
        id: frontend_build
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install backend for browser integration
        run: |
          python -m pip install uv==0.12.23
          uv sync --project .. --locked --extra web --group dev
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Test built React app with actual FastAPI backend
        id: browser_tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-evidence-${{ runner.os }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve the frontend build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ success() && runner.os == 'Linux' }}
        with:
          name: frontend-build
          path: frontend/dist/
          if-no-files-found: error
          retention-days: 14
      - name: Summarize browser checks
        if: always()
        shell: python {0}
        env:
          LAB_REACT_OUTCOME: ${{ steps.react_tests.outcome }}
          LAB_BUILD_OUTCOME: ${{ steps.frontend_build.outcome }}
          LAB_BROWSER_OUTCOME: ${{ steps.browser_tests.outcome }}
        run: |
          import json
          import os
          from pathlib import Path
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
              stream.write("## Browser checks on " + os.environ["RUNNER_OS"] + "\n\n")
              for label, key in [("React tests", "LAB_REACT_OUTCOME"), ("Production build", "LAB_BUILD_OUTCOME"), ("Chromium with FastAPI", "LAB_BROWSER_OUTCOME")]:
                  stream.write("- " + label + ": **" + os.environ[key] + "**.\n")
              coverage = Path("coverage/coverage-summary.json")
              if os.environ["RUNNER_OS"] == "Linux" and os.environ["LAB_REACT_OUTCOME"] == "success" and coverage.is_file():
                  totals = json.loads(coverage.read_text(encoding="utf-8"))["total"]
                  stream.write("- Unit-test coverage: **" + str(totals["lines"]["pct"]) + "% lines**, **" + str(totals["branches"]["pct"]) + "% branches**. Browser integration tests are separate.\n")
              stream.write("\nThe server existed only inside this job. The frontend build requires the matching Python backend; it is not a deployed website.\n")
