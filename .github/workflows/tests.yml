name: Offline tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: offline-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install locked Python environment including local web tools
        run: |
          python -m pip install uv==0.12.23
          uv sync --locked --extra web --group dev
      - name: Behavioral tests without API keys
        run: uv run --locked --extra web python -m unittest discover -s tests -v
      - name: Complete development catalog with mock only
        run: uv run --locked --extra web python -m security_lab run --output runs/ci --repeats 1
      - name: Recompute summary from verified originals
        run: uv run --locked --extra web python -m security_lab summarize runs/ci --output runs/ci/recomputed.json
      - name: Export blinded review material
        run: uv run --locked --extra web python -m security_lab review-export runs/ci --output runs/review
      - name: Archive, verify and restore original campaign evidence
        run: |
          uv run --locked --extra web python -m security_lab archive runs/ci --output runs/ci.zip
          uv run --locked --extra web python -m security_lab verify-archive runs/ci.zip
          uv run --locked --extra web python -m security_lab restore-archive runs/ci.zip --output runs/restored
  frontend:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install backend for browser integration
        run: |
          python -m pip install uv==0.12.23
          uv sync --project .. --locked --extra web --group dev
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Test built React app with actual FastAPI backend
        run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-evidence-${{ runner.os }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
