name: Read-only Sonar issue inventory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Collect unresolved main issues and analysis metadata without mutations
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: python scripts/sonar_inventory.py
      - name: Preserve sanitized inventory for individual review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sonar-main-inventory
          path: quality-inventory/sonar-main.json
          if-no-files-found: error
          retention-days: 14
