# Existing paid compute plan and separately authorized 1 GB disk.
# The live service is managed directly in Render, not through Blueprint sync.
# This file records its verified configuration; do not create a duplicate service.
# Disk persistence was checked across a controlled redeployment on 2026-11-02.
# Storage costs USD 0.25/month; the owner-approved ceiling is USD 1/month.
# GitHub OAuth is configured directly in the backend; no secret values here.
# See docs/hosting.md and docs/validation.md for evidence and operating limits.
services:
  - type: web
    name: llm-agent-security-lab-demo-api
    runtime: python
    branch: main
    region: frankfurt
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: checksPass
    buildCommand: |
      set -eu
      python -m pip install uv==0.12.23
      uv sync --locked --extra web --no-dev
    startCommand: uv run --locked --extra web --no-dev python -m security_lab.hosted_cli
    healthCheckPath: /healthz
    disk:
      name: disk
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: LAB_FRONTEND_ORIGIN
        value: https://sxba-04.github.io
      - key: LAB_WORKSPACE
        value: /var/data/security-lab
      - key: LAB_STORAGE_MODE
        value: persistent
      - key: LAB_ACCESS_TOKEN_HASHES
        sync: false
      - key: PYTHONUNBUFFERED
        value: '1'
      - key: PYTHONUTF8
        value: '1'
