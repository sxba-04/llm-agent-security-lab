# Existing paid compute plan, upgraded by the owner on 2026-11-02.
# The live service is managed directly in Render, not through Blueprint sync.
# This file records its intended configuration; do not create a duplicate service.
# Storage remains ephemeral. No disk or database is provisioned here.
# Owner authorized a 1 GB disk (storage ceiling USD 1/month) on 2026-11-02.
# Attachment, migration and restart verification remain pending: keep runtime
# values ephemeral until completed. Optional GitHub OAuth is implemented but
# has no live app/client-secret configuration yet. See docs/hosting.md.
services:
  - type: web
    name: llm-agent-security-lab-demo-api
    runtime: python
    branch: main
    region: frankfurt
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: checksPass
    buildCommand: |
      set -eu
      python -m pip install uv==0.12.23
      uv sync --locked --extra web --no-dev
    startCommand: uv run --locked --extra web --no-dev python -m security_lab.hosted_cli
    healthCheckPath: /healthz
    envVars:
      - key: LAB_FRONTEND_ORIGIN
        value: https://sxba-04.github.io
      - key: LAB_WORKSPACE
        value: /tmp/security-lab-demo
      - key: LAB_STORAGE_MODE
        value: ephemeral
      - key: LAB_ACCESS_TOKEN_HASHES
        sync: false
      - key: PYTHONUNBUFFERED
        value: '1'
      - key: PYTHONUTF8
        value: '1'
