# Free, disposable mock test environment. No disk or database is provisioned.
# Keep the Hobby workspace without a payment method to stop instead of billing
# when free quotas are exhausted. See docs/hosting.md before deployment.
services:
  - type: web
    name: llm-agent-security-lab-demo-api
    runtime: python
    branch: main
    region: frankfurt
    plan: free
    numInstances: 1
    autoDeployTrigger: checksPass
    buildCommand: |
      set -eu
      python -m pip install uv==0.12.23
      uv sync --locked --extra web --no-dev
    startCommand: uv run --locked --extra web --no-dev python -m security_lab.hosted_cli
    healthCheckPath: /healthz
    envVars:
      - key: LAB_FRONTEND_ORIGIN
        value: https://sxba-04.github.io
      - key: LAB_WORKSPACE
        value: /tmp/security-lab-demo
      - key: LAB_STORAGE_MODE
        value: ephemeral
      - key: LAB_ACCESS_TOKEN_HASHES
        sync: false
      - key: PYTHONUNBUFFERED
        value: '1'
      - key: PYTHONUTF8
        value: '1'
