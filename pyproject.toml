[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-agent-security-lab"
version = "0.1.0"
description = "Synthetic, reproducible lab for indirect prompt injection and tool authorization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
security-lab = "security_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
